@if (breadcrumbs.length > 0) {
  <div class="page-header">
    <h1 class="page-title">
      {{ breadcrumbs[breadcrumbs.length - 1].name }}
    </h1>

    @if (breadcrumbs[breadcrumbs.length - 1].description) {
      <p class="page-description">
        {{ breadcrumbs[breadcrumbs.length - 1].description }}
      </p>
    }
  </div>
}
