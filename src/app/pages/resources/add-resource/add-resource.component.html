<div class="NewHeader">
  <h1 mat-dialog-title>
    {{ isEditMode ? 'Update Resource' : 'Add Resource' }}
  </h1>
</div>

<div mat-dialog-content>
  <div class="col-sm-12" style="margin-bottom: 10px; padding-top: 15px;">
    <form [formGroup]="form" (ngSubmit)="save()">

      <!-- Resource Name -->
      <div class="row" style="margin-bottom: 14px; display: flex; align-items: center;">
        <div class="col-sm-4">
          <label class="add-member-label control-label" style="margin-top: 5px;">Resource Name :</label>
        </div>
        <div class="col-sm-8">
          <input class="form-control name back" maxlength="100" placeholder="Enter Resource Name"
                 formControlName="resourceName" type="text">
        </div>
      </div>

      <!-- From Date -->
      <div class="row" style="margin-bottom: 14px; display: flex; align-items: center;">
        <div class="col-sm-4">
          <label class="add-member-label control-label" style="margin-top: 5px;">From Date :</label>
        </div>
        <div class="col-sm-8">
          <input class="form-control" type="date" formControlName="fromDate" placeholder="mm/dd/yyyy">
        </div>
      </div>

      <!-- To Date -->
      <div class="row" style="margin-bottom: 14px; display: flex; align-items: center;">
        <div class="col-sm-4">
          <label class="add-member-label control-label" style="margin-top: 5px;">To Date :</label>
        </div>
        <div class="col-sm-8">
          <input class="form-control" type="date" formControlName="toDate" placeholder="mm/dd/yyyy">
        </div>
      </div>

      <!-- From Time -->
      <div class="row" style="margin-bottom: 14px; display: flex; align-items: center;">
        <div class="col-sm-4">
          <label class="add-member-label control-label" style="margin-top: 5px;">From Time :</label>
        </div>
        <div class="col-sm-8">
          <input class="form-control" type="time" formControlName="fromTime" placeholder="--:-- --">
        </div>
      </div>

      <!-- To Time -->
      <div class="row" style="margin-bottom: 14px; display: flex; align-items: center;">
        <div class="col-sm-4">
          <label class="add-member-label control-label" style="margin-top: 5px;">To Time :</label>
        </div>
        <div class="col-sm-8">
          <input class="form-control" type="time" formControlName="toTime" placeholder="--:-- --">
        </div>
      </div>

      <!-- Footer Actions -->
      <div style="margin-top: 20px; margin-bottom: 10px;">
        <div class="pull-right" style="display: flex; justify-content: flex-end; gap: 10px;">
          <button type="button" class="app-btn app-btn-default" (click)="close()">
            <mat-icon>cancel</mat-icon> Close
          </button>
          <button type="submit" class="app-btn app-btn-primary" [disabled]="form.invalid">
            <mat-icon>save</mat-icon> Save
          </button>
        </div>
      </div>

    </form>
  </div>
</div>
