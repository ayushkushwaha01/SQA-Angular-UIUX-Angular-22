<div class="delete-confirmation-header">
  <h1 mat-dialog-title>Delete Confirmation</h1>
</div>

<div mat-dialog-content class="delete-confirmation-content">
  <p>Are you sure you want to delete this record?</p>
</div>

<div mat-dialog-actions class="delete-confirmation-actions">
  <button type="button" class="delete-confirm-button" (click)="confirm()">Yes</button>
  <button type="button" class="delete-cancel-button" (click)="cancel()">No</button>
</div>
